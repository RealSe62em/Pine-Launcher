name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive freshly built Linux packages (leave blank for a verification-only run)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$packageVersion"
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build x64 installer
        run: npm run build:installer:x64

      - name: Preserve x64 updater metadata
        shell: pwsh
        run: Move-Item -LiteralPath dist-native/latest.yml -Destination dist-native/latest-x64.yml -Force

      - name: Build ARM64 installer
        run: npm run build:installer:arm64

      - name: Preserve architecture-specific updater metadata
        shell: pwsh
        run: |
          Move-Item -LiteralPath dist-native/latest.yml -Destination dist-native/latest-arm64.yml -Force
          Copy-Item -LiteralPath dist-native/latest-x64.yml -Destination dist-native/latest.yml -Force

      - name: Verify packaged source and create checksums
        shell: pwsh
        run: |
          $expected = (Get-Content package.json | ConvertFrom-Json).version
          $archives = @(
            'dist-native/win-unpacked/resources/app.asar',
            'dist-native/win-arm64-unpacked/resources/app.asar'
          )
          foreach ($archive in $archives) {
            $actual = node -e "const a=require('@electron/asar');console.log(JSON.parse(a.extractFile(process.argv[1],'package.json')).version)" $archive
            if ($actual.Trim() -ne $expected) { throw "$archive contains version $actual, expected $expected" }
          }
          if (-not (Test-Path 'dist-native/latest.yml')) { throw 'Missing updater metadata: latest.yml' }
          if (-not (Select-String -Path 'dist-native/latest.yml' -Pattern "version: $expected" -Quiet)) {
            throw 'latest.yml does not match the package version'
          }
          if (-not (Select-String -Path 'dist-native/latest.yml' -Pattern '^path: PineLauncherSetup-x64\.exe$' -Quiet)) {
            throw 'latest.yml must point x64 installed apps at the x64 installer'
          }
          if (-not (Select-String -Path 'dist-native/latest-arm64.yml' -Pattern '^path: PineLauncherSetup-arm64\.exe$' -Quiet)) {
            throw 'latest-arm64.yml must point ARM64 installed apps at the ARM64 installer'
          }
          $requiredUpdateAssets = @(
            'dist-native/PineLauncherSetup-x64.exe.blockmap',
            'dist-native/PineLauncherSetup-arm64.exe.blockmap'
          )
          foreach ($asset in $requiredUpdateAssets) {
            if (-not (Test-Path $asset)) { throw "Missing updater asset: $asset" }
          }
          $providerFiles = @(
            'dist-native/win-unpacked/resources/app-update.yml',
            'dist-native/win-arm64-unpacked/resources/app-update.yml'
          )
          foreach ($providerFile in $providerFiles) {
            $provider = Get-Content $providerFile -Raw
            if ($provider -notmatch 'provider: github' -or $provider -notmatch 'owner: RealSe62em' -or $provider -notmatch 'repo: Pine-Launcher') {
              throw "Invalid packaged update provider: $providerFile"
            }
          }
          Get-ChildItem dist-native/PineLauncherSetup*.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist-native/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pine-Launcher-${{ github.ref_name }}
          path: |
            dist-native/PineLauncherSetup*.exe
            dist-native/PineLauncherSetup*.blockmap
            dist-native/latest.yml
            dist-native/latest-arm64.yml
            dist-native/SHA256SUMS.txt

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-native/PineLauncherSetup*.exe
            dist-native/PineLauncherSetup*.blockmap
            dist-native/latest.yml
            dist-native/latest-arm64.yml
            dist-native/SHA256SUMS.txt

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Verify manual release tag matches package version
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "${{ inputs.release_tag }}"

      - name: Install locked dependencies
        run: npm ci

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools zstd

      - name: Run tests
        run: npm test

      - name: Build Debian x64 package
        run: npm run build:deb:x64

      - name: Build Debian ARM64 package
        run: npm run build:deb:arm64

      - name: Build Arch Linux x64 package
        run: npm run build:pacman:x64

      - name: Create Linux checksums
        working-directory: dist-native
        run: sha256sum PineLauncher-*-linux-*.deb PineLauncher-*-archlinux-*.pacman > SHA256SUMS-linux.txt

      - name: Upload Linux workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pine-Launcher-Linux-${{ github.ref_name }}
          path: |
            dist-native/PineLauncher-*-linux-*.deb
            dist-native/PineLauncher-*-archlinux-*.pacman
            dist-native/SHA256SUMS-linux.txt

      - name: Publish tagged Linux release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-native/PineLauncher-*-linux-*.deb
            dist-native/PineLauncher-*-archlinux-*.pacman
            dist-native/SHA256SUMS-linux.txt

      - name: Publish manually requested Linux release assets
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist-native/PineLauncher-*-linux-*.deb
            dist-native/PineLauncher-*-archlinux-*.pacman
            dist-native/SHA256SUMS-linux.txt
