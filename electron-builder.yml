appId: com.pine.launcher
productName: Pine Launcher
electronVersion: 39.8.10
electronUpdaterCompatibility: ">=2.16"
publish:
  provider: github
  owner: RealSe62em
  repo: Pine-Launcher
  releaseType: release
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
electronLanguages:
  - en-US
directories:
  output: dist-native
  buildResources: build
files:
  - main.js
  - preload.js
  - package.json
  - icon.png
  - renderer/**
  - lib/**
  - "!scripts/**"
  - "!installer/**"
  - "!test/**"
  - "!dist*/**"
  - "!build/**"
  - "!settings.json"
win:
  target: nsis
  icon: build/icon.ico
  artifactName: PineLauncherSetup-${arch}.exe
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pine Launcher
  uninstallDisplayName: Pine Launcher
  deleteAppDataOnUninstall: false
  runAfterFinish: true
linux:
  syncDesktopName: true
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: pacman
      arch:
        - x64
  category: Game
  icon: icon.png
  executableName: pine-launcher
  artifactName: PineLauncher-${version}-linux-${arch}.${ext}
  desktop:
    entry:
      Name: Pine Launcher
      Comment: Multi-instance Minecraft launcher
      Categories: Game;
deb:
  packageName: pine-launcher
  packageCategory: games
  maintainer: Pine Launcher
  synopsis: Multi-instance Minecraft launcher
  description: Pine Launcher manages isolated Minecraft instances, loaders, Java runtimes, mods, packs, worlds, and backups.
  priority: optional
pacman:
  packageName: pine-launcher
  packageCategory: games
  maintainer: Pine Launcher
  synopsis: Multi-instance Minecraft launcher
  description: Pine Launcher manages isolated Minecraft instances, loaders, Java runtimes, mods, packs, worlds, and backups.
  compression: zstd
  artifactName: PineLauncher-${version}-archlinux-${arch}.${ext}
  # electron-builder's legacy Pacman defaults still include the removed
  # http-parser package. These are the current Arch packages needed by the
  # bundled Electron runtime and Pine's Secret Service integration.
  depends:
    - alsa-lib
    - at-spi2-core
    - cairo
    - cups
    - dbus
    - expat
    - gcc-libs
    - glib2
    - glibc
    - gtk3
    - libdrm
    - libsecret
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - libxss
    - libxtst
    - mesa
    - nspr
    - nss
    - pango
    - systemd-libs
    - xdg-utils
