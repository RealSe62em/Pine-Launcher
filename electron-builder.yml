appId: com.pine.launcher
productName: Pine Launcher
electronVersion: 39.8.10
electronUpdaterCompatibility: ">=2.16"
publish:
  provider: github
  owner: RealSe62em
  repo: Pine-Launcher
  releaseType: release
asar: true
electronLanguages:
  - en-US
directories:
  output: dist-native
  buildResources: build
files:
  - main.js
  - preload.js
  - package.json
  - renderer/**
  - lib/**
  - "!scripts/**"
  - "!installer/**"
  - "!test/**"
  - "!dist*/**"
  - "!build/**"
  - "!settings.json"
win:
  target: nsis
  icon: build/icon.ico
  artifactName: PineLauncherSetup-${arch}.exe
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pine Launcher
  uninstallDisplayName: Pine Launcher
  deleteAppDataOnUninstall: false
  runAfterFinish: true
